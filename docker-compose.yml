services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reef_1000
      POSTGRES_DB: reef_1000_production
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-queue-db.sh:/docker-entrypoint-initdb.d/init-queue-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reef_1000 -d reef_1000_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/jonesdeini/reef-1000:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment: &app_env
      PGHOST: postgres
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      APEX_FUSION_USERNAME: ${APEX_FUSION_USERNAME}
      APEX_FUSION_PASSWORD: ${APEX_FUSION_PASSWORD}
      APEX_CONTROLLER_ID: ${APEX_CONTROLLER_ID}
      APEX_KALK_PUMP_OUTPUT_NAME: ${APEX_KALK_PUMP_OUTPUT_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  jobs:
    image: ghcr.io/jonesdeini/reef-1000:latest
    restart: unless-stopped
    command: bin/jobs
    depends_on:
      web:
        condition: service_healthy
    environment: *app_env

  updater:
    image: docker:cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    working_dir: /app
    entrypoint: sh
    command: -c 'while true; do docker compose pull --quiet && docker compose up -d && docker image prune -f; sleep 300; done'
