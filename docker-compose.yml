services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reef_1000
      POSTGRES_DB: reef_1000_production
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-queue-db.sh:/docker-entrypoint-initdb.d/init-queue-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reef_1000 -d reef_1000_production"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/jonesdeini/reef-1000:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment: &app_env
      PGHOST: postgres
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      APEX_FUSION_USERNAME: ${APEX_FUSION_USERNAME}
      APEX_FUSION_PASSWORD: ${APEX_FUSION_PASSWORD}
      APEX_CONTROLLER_ID: ${APEX_CONTROLLER_ID}
      APEX_KALK_PUMP_OUTPUT_NAME: ${APEX_KALK_PUMP_OUTPUT_NAME}
      SENTRY_DSN: ${SENTRY_DSN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  jobs:
    image: ghcr.io/jonesdeini/reef-1000:latest
    restart: unless-stopped
    command: bin/jobs
    depends_on:
      web:
        condition: service_healthy
    environment: *app_env

  updater:
    image: docker:cli
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: reef-1000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/reefff/reef-1000:/mnt/user/reefff/reef-1000
    working_dir: /mnt/user/reefff/reef-1000
    entrypoint: sh
    # Pulling the image was never enough on its own — compose-file changes
    # (new env vars, new services, port changes) only reach this box via
    # `git pull` on this checkout, which nothing was doing automatically.
    # Hit this for real (2026-11-02): main shipped two releases' worth of
    # compose changes that silently never applied here. `apk add git` +
    # `safe.directory` are container-local, not persisted to the host.
    command: -c 'apk add --no-cache git >/dev/null 2>&1; git config --global --add safe.directory /mnt/user/reefff/reef-1000; while true; do git pull --ff-only --quiet || true; docker compose pull --quiet web jobs postgres && docker compose up -d web jobs postgres && docker image prune -f; sleep 300; done'
